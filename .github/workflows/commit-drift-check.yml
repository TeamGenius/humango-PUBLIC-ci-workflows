name: Commit Drift Check

on:
  workflow_call:
    inputs:
      max_behind:
        type: number
        default: 5
      max_ahead:
        type: number
        default: 50
      compare_ref:
        type: string
        default: ""
      base_ref:
        type: string
        default: ""

jobs:
  drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute drift
        id: drift
        env:
          INPUT_COMPARE_REF: ${{ inputs.compare_ref }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          BASE_REF="$INPUT_BASE_REF"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="$PR_BASE_REF"
          fi
          if [ -z "$BASE_REF" ]; then
            BASE_REF="${GITHUB_REF_NAME}"
          fi

          TARGET_REF="HEAD"
          if [ -n "$INPUT_COMPARE_REF" ]; then
            git fetch origin "$INPUT_COMPARE_REF"
            TARGET_REF="origin/$INPUT_COMPARE_REF"
          elif [ -n "$PR_HEAD_REF" ]; then
            git fetch origin "$PR_HEAD_REF"
            TARGET_REF="origin/$PR_HEAD_REF"
          fi

          git fetch origin "$BASE_REF"

          BEHIND=$(git rev-list --count "$TARGET_REF".."origin/$BASE_REF")
          AHEAD=$(git rev-list --count "origin/$BASE_REF".."$TARGET_REF")

          echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT
          echo "target_ref=$TARGET_REF" >> $GITHUB_OUTPUT

          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT

      - name: Display drift
        env:
          BASE_REF: ${{ steps.drift.outputs.base_ref }}
          TARGET_REF: ${{ steps.drift.outputs.target_ref }}
          BEHIND: ${{ steps.drift.outputs.behind }}
          AHEAD: ${{ steps.drift.outputs.ahead }}
          MAX_BEHIND: ${{ inputs.max_behind }}
          MAX_AHEAD: ${{ inputs.max_ahead }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "base_ref=$BASE_REF"
          echo "target_ref=$TARGET_REF"
          echo "behind=$BEHIND"
          echo "ahead=$AHEAD"

          {
            echo "### Commit Drift Check"
            echo
            echo "- Base branch: \`$BASE_REF\`"
            echo "- Compared ref: \`$TARGET_REF\`"
            echo
            if [ "$MAX_BEHIND" -gt 0 ]; then
              if [ "$BEHIND" -gt "$MAX_BEHIND" ]; then
                echo "- Behind: $BEHIND / $MAX_BEHIND (exceeded)"
              else
                echo "- Behind: $BEHIND / $MAX_BEHIND (ok)"
              fi
            fi
            if [ "$MAX_AHEAD" -gt 0 ]; then
              if [ "$AHEAD" -gt "$MAX_AHEAD" ]; then
                echo "- Ahead: $AHEAD / $MAX_AHEAD (exceeded)"
              else
                echo "- Ahead: $AHEAD / $MAX_AHEAD (ok)"
              fi
            fi
            if [ "$MAX_BEHIND" -le 0 ] && [ "$MAX_AHEAD" -le 0 ]; then
              echo "- All drift checks are disabled."
            fi
            if [ "$BEHIND" -gt 0 ] && [ -n "$PR_URL" ]; then
              echo
              echo "Action: [Open PR and click Update branch]($PR_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if limits exceeded
        run: |
          if [ "${{ inputs.max_behind }}" -gt 0 ] && [ "${{ steps.drift.outputs.behind }}" -gt "${{ inputs.max_behind }}" ]; then
            echo "❌ Branch is too far behind base"
            exit 1
          fi

          if [ "${{ inputs.max_ahead }}" -gt 0 ] && [ "${{ steps.drift.outputs.ahead }}" -gt "${{ inputs.max_ahead }}" ]; then
            echo "❌ PR has too many commits"
            exit 1
          fi