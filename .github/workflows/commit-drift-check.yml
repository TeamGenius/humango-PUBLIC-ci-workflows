name: (Reusable) Commit Drift Check

on:
  workflow_call:
    inputs:
      max_behind:
        type: number
        default: 5
      base_ref:
        type: string
        default: ''
      head_sha:
        description: 'PR head commit SHA (used when called from a push-triggered matrix job)'
        type: string
        default: ''
      head_ref:
        description: 'PR head branch name (used for remediation guidance in non-PR events)'
        type: string
        default: ''
      pr_number:
        description: 'PR number (used when called from a push-triggered matrix job)'
        type: number
        default: 0

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  drift:
    name: Commit Drift Gate
    runs-on: [self-hosted, small, gke, linux, preemptible, humango]
    timeout-minutes: 4 # 4 min
    concurrency:
      group: commit-drift-pr-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute drift
        id: drift
        env:
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          EVENT_BASE_REF: ${{ github.base_ref }}
          DEFAULT_BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          TARGET_REF="${{ inputs.head_sha }}"
          if [ -z "$TARGET_REF" ]; then
            TARGET_REF="HEAD"
          fi

          RESOLVED_BASE_REF="$INPUT_BASE_REF"
          if [ -z "$RESOLVED_BASE_REF" ]; then
            RESOLVED_BASE_REF="$EVENT_BASE_REF"
          fi
          if [ -z "$RESOLVED_BASE_REF" ]; then
            RESOLVED_BASE_REF="$DEFAULT_BASE_REF"
          fi

          if [ -z "$RESOLVED_BASE_REF" ]; then
            echo "Unable to determine a base branch for drift calculation."
            echo "behind=0" >> "$GITHUB_OUTPUT"
            echo "ahead=0" >> "$GITHUB_OUTPUT"
            echo "target_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
            echo "base_ref=" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "message=No base branch available for drift check." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin "$RESOLVED_BASE_REF"

          BASE_TARGET="origin/$RESOLVED_BASE_REF"
          BEHIND=$(git rev-list --count "$TARGET_REF".."$BASE_TARGET")
          AHEAD=$(git rev-list --count "$BASE_TARGET".."$TARGET_REF")

          MAX_BEHIND="${{ inputs.max_behind }}"
          if [ "$MAX_BEHIND" -eq 0 ]; then
            STATUS="pass"
            MESSAGE="Behind check disabled"
          elif [ "$BEHIND" -le "$MAX_BEHIND" ]; then
            STATUS="pass"
            MESSAGE="Within allowed commit drift"
          else
            STATUS="fail"
            MESSAGE="Branch is behind base by more than allowed"
          fi

          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "target_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "base_ref=$RESOLVED_BASE_REF" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"

          echo "Base branch: $RESOLVED_BASE_REF"
          echo "Current branch/ref: $TARGET_REF"
          echo "Behind: $BEHIND"
          echo "Ahead: $AHEAD"
          echo "Status: $STATUS"

      - name: Drift summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          BEHIND="${{ steps.drift.outputs.behind }}"
          AHEAD="${{ steps.drift.outputs.ahead }}"
          TARGET_REF="${{ steps.drift.outputs.target_ref }}"
          BASE_REF="${{ steps.drift.outputs.base_ref }}"
          MAX_BEHIND="${{ inputs.max_behind }}"
          STATUS="${{ steps.drift.outputs.status }}"

          {
            echo "### Commit Drift Check"
            echo
            echo "- Base branch: $BASE_REF"
            echo "- Current branch/ref: $TARGET_REF"
            echo "- Behind: $BEHIND (limit: $MAX_BEHIND)"
            echo "- Ahead: $AHEAD (informational only)"
            if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "0" ]; then
              echo "- PR: $REPO_URL/pull/$PR_NUMBER"
            fi
            echo
            if [ "$MAX_BEHIND" = "0" ]; then
              echo "ℹ️ Behind check is disabled because max_behind is set to 0."
            elif [ "$STATUS" = "pass" ]; then
              echo "✅ Drift is within allowed threshold."
            elif [ "$STATUS" = "fail" ]; then
              echo "❌ This PR is too far behind to merge safely with the configured threshold."
              echo
              echo "### Required Action"
              echo "- Option 1 (GitHub UI): Use the **Update branch** button on the PR if available."
              echo "- Option 2 (local git):"
              echo "  1. Update your local base branch:"
              echo "     \`git pull origin $BASE_REF\`"
              echo "  2. Switch to the head branch:"
              echo "     \`git checkout ${{ github.head_ref || github.ref_name }}\`"
              echo "  3. Merge the base branch into the head branch:"
              echo "     \`git merge $BASE_REF\`"
              echo "  4. If there are conflicts, resolve them and commit the result."
              echo "  5. Push the changes:"
              echo "     \`git push -u origin ${{ github.head_ref || github.ref_name }}\`"
            else
              echo "ℹ️ Drift check skipped because no base branch could be determined."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert PR feedback comment
        if: ${{ (github.event.pull_request.number != null || inputs.pr_number != 0) && steps.drift.outputs.status != 'skipped' }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          BEHIND: ${{ steps.drift.outputs.behind }}
          MAX_BEHIND: ${{ inputs.max_behind }}
          BASE_REF: ${{ steps.drift.outputs.base_ref }}
          STATUS: ${{ steps.drift.outputs.status }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || inputs.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const marker = '<!-- commit-drift-check -->';
            const prNumber = context.payload.pull_request?.number ?? Number(process.env.INPUT_PR_NUMBER);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const statusLine = process.env.STATUS === 'pass'
              ? `✅ This PR is within drift threshold (${process.env.BEHIND}/${process.env.MAX_BEHIND} behind).`
              : `❌ This PR is ${process.env.BEHIND} commits behind ${process.env.BASE_REF} (limit: ${process.env.MAX_BEHIND}).`;

            const body = [
              marker,
              '### Commit Drift Gate',
              '',
              statusLine,
              '',
              process.env.STATUS === 'fail'
                ? 'Required action before merge:'
                : 'No action required.',
              process.env.STATUS === 'fail'
                ? '- Option 1 (GitHub UI): click **Update branch** on this PR (when available).'
                : '',
              process.env.STATUS === 'fail'
                ? '- Option 2 (local git):'
                : '',
              process.env.STATUS === 'fail'
                ? `  1. Update your local base branch: \`git pull origin ${process.env.BASE_REF}\``
                : '',
              process.env.STATUS === 'fail'
                ? `  2. Switch to the head branch: \`git checkout ${process.env.HEAD_REF}\``
                : '',
              process.env.STATUS === 'fail'
                ? `  3. Merge the base branch into the head branch: \`git merge ${process.env.BASE_REF}\``
                : '',
              process.env.STATUS === 'fail'
                ? '  4. If there are conflicts, resolve them and commit the result.'
                : '',
              process.env.STATUS === 'fail'
                ? `  5. Push the changes: \`git push -u origin ${process.env.HEAD_REF}\``
                : ''
            ].filter(Boolean).join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100
            });

            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });
            }

      - name: Post commit status
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          STATUS: ${{ steps.drift.outputs.status }}
          BEHIND: ${{ steps.drift.outputs.behind }}
          MAX_BEHIND: ${{ inputs.max_behind }}
          BASE_REF: ${{ steps.drift.outputs.base_ref }}
        with:
          script: |
            const state = process.env.STATUS === 'fail' ? 'failure' : 'success';
            const desc = process.env.STATUS === 'fail'
              ? `${process.env.BEHIND} commits behind ${process.env.BASE_REF} (limit: ${process.env.MAX_BEHIND})`
              : `Within drift threshold (${process.env.BEHIND}/${process.env.MAX_BEHIND} behind)`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state,
              context: 'commit-drift/within-threshold',
              description: desc.slice(0, 140)
            });

      - name: Fail if behind limit exceeded
        run: |
          if [ "${{ steps.drift.outputs.status }}" = "fail" ]; then
            echo "❌ Branch is too far behind base. See summary and PR comment for next steps."
            exit 1
          fi