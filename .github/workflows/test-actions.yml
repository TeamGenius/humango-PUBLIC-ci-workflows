name: Test Shared Actions 4
# update

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      max_behind:
        description: Max commits behind base (0 disables)
        required: true
        default: '1'
      max_ahead:
        description: Max commits ahead of base (0 disables)
        required: true
        default: '1'

jobs:
  drift:
    uses: TeamGenius/humango-PUBLIC-ci-workflows/.github/workflows/commit-drift-check.yml@master
    with:
      max_behind: 2
      max_ahead: 0
