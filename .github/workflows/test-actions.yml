name: Test Shared Actions 4

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      max_behind:
        description: Max commits behind base (0 disables)
        required: true
        default: '5'
      base_ref:
        description: Base branch to compare against (blank uses PR base/default branch)
        required: false
        default: ''

jobs:
  drift:
    uses: ./.github/workflows/commit-drift-check.yml
    with:
      max_behind: ${{ github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.max_behind) || 1 }}
      base_ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.base_ref || '' }}

