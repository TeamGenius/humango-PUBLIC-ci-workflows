name: Determine SonarQube Variables
description: >-
  SonarQube project key and new-code reference branch for one SonarQube project per repository
  (community branch plugin)

inputs:
  project-prefix:
    description: SonarQube project key of the repository (e.g. humango-backend)
    required: true

  current-branch:
    description: Analyzed branch (default github.ref_name)
    required: false
    default: ''

  single-project:
    description: >-
      Deprecated and ignored: single-project is the only mode since the per-branch projects
      (<prefix>-release, <prefix>-master) were deleted on 2026-11-10. Kept so existing callers
      need no change.
    required: false
    default: 'true'

  sonar-host-url:
    description: SonarQube URL, to check that the reference branch has been analyzed
    required: false
    default: ''

  sonar-token:
    description: SonarQube token, to check that the reference branch has been analyzed
    required: false
    default: ''

outputs:
  reference-branch:
    description: >-
      New-code reference branch chosen by resolve-new-code-reference.sh (empty = use the
      project's new-code setting: pull requests, development, master, alpha)
    value: ${{ steps.single.outputs.reference-branch }}

  project-key:
    description: SonarQube project key (project-prefix)
    value: ${{ inputs.project-prefix }}

runs:
  using: composite
  steps:
    - id: single
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BRANCH: ${{ inputs.current-branch || github.ref_name }}
        PROJECT_KEY: ${{ inputs.project-prefix }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      run: |
        reference="$("$GITHUB_ACTION_PATH/resolve-new-code-reference.sh")"
        echo "reference-branch=$reference" >> "$GITHUB_OUTPUT"
