name: 'Run SonarQube Scan'
description: 'Execute SonarQube Scanner with configurable settings'
inputs:
  sonar-project-key:
    description: 'SonarQube project key'
    required: true
  sonar-project-version:
    description: 'SonarQube project version'
    required: true
  sonar-reference-branch:
    description: >-
      SonarQube new code reference branch. Leave empty to use the project's new-code setting
      (recommended with one SonarQube project per repository).
    required: false
    default: ''
  sonar-token:
    description: 'SonarQube authentication token'
    required: true
  sonar-host-url:
    description: 'SonarQube server URL'
    required: true
  project-settings-file:
    description: 'Path to sonar-project.properties file'
    required: false
    default: 'sonar-project.properties'
  extra-args:
    description: 'Additional SonarQube scanner arguments'
    required: false
    default: ''
  branch-name:
    description: >-
      Branch that was checked out and is being analyzed. Pass it whenever the checkout ref can
      differ from the workflow ref (e.g. workflow_dispatch with a branch input): otherwise the
      community branch plugin names the analysis after GITHUB_REF_NAME and can overwrite another
      branch's results. Ignored for pull_request events, which are auto-detected as PR analyses.
    required: false
    default: ''
  wait-for-quality-gate:
    description: >-
      'true' makes the scanner wait for the quality gate and fail the step when it is not OK,
      replacing the separate check-quality-gate action.
    required: false
    default: 'false'
  quality-gate-timeout:
    description: 'Seconds to wait for the quality gate when wait-for-quality-gate is true'
    required: false
    default: '300'
  project-base-dir:
    description: 'Analysis base directory (sonar.projectBaseDir), relative to the workspace'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    # With the community branch plugin the scanner auto-detects the analyzed branch, and it
    # refuses a new-code reference branch equal to that branch (e.g. the scheduled development
    # deploy). Drop the reference in that case so Sonar falls back to the project's new-code setting.
    - name: Resolve branch and quality gate arguments
      id: reference
      shell: bash
      env:
        REFERENCE_BRANCH: ${{ inputs.sonar-reference-branch }}
        BRANCH_NAME: ${{ inputs.branch-name }}
        EVENT_NAME: ${{ github.event_name }}
        CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        WAIT_FOR_QUALITY_GATE: ${{ inputs.wait-for-quality-gate }}
        QUALITY_GATE_TIMEOUT: ${{ inputs.quality-gate-timeout }}
      run: |
        args=()

        if [[ -n "$BRANCH_NAME" && "$EVENT_NAME" != pull_request* ]]; then
          CURRENT_BRANCH="$BRANCH_NAME"
          args+=("-Dsonar.branch.name=$BRANCH_NAME")
          echo "Info: analyzing branch '$BRANCH_NAME'"
        fi

        if [[ -n "$REFERENCE_BRANCH" && "$REFERENCE_BRANCH" != "$CURRENT_BRANCH" ]]; then
          args+=("-Dsonar.newCode.referenceBranch=$REFERENCE_BRANCH")
        else
          echo "Info: reference branch '$REFERENCE_BRANCH' is the analyzed branch; not setting sonar.newCode.referenceBranch"
        fi

        if [[ "$WAIT_FOR_QUALITY_GATE" == "true" ]]; then
          args+=("-Dsonar.qualitygate.wait=true" "-Dsonar.qualitygate.timeout=$QUALITY_GATE_TIMEOUT")
        fi

        echo "arg=${args[*]}" >> "$GITHUB_OUTPUT"

    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_SCANNER_OPTS: -Xmx1536m
      with:
        projectBaseDir: ${{ inputs.project-base-dir }}
        # Branch vs pull request analysis is detected by the community branch plugin (or forced
        # with branch-name); the project key still selects which SonarQube project receives it.
        args: >
          -Dproject.settings=${{ inputs.project-settings-file }}
          -Dsonar.projectKey=${{ inputs.sonar-project-key }}
          -Dsonar.projectVersion=${{ inputs.sonar-project-version }}
          ${{ steps.reference.outputs.arg }}
          ${{ inputs.extra-args }}
