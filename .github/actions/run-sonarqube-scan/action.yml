name: 'Run SonarQube Scan'
description: 'Execute SonarQube Scanner with configurable settings'
inputs:
  sonar-project-key:
    description: 'SonarQube project key'
    required: true
  sonar-project-version:
    description: 'SonarQube project version'
    required: true
  sonar-reference-branch:
    description: 'SonarQube new code reference branch'
    required: true
  sonar-token:
    description: 'SonarQube authentication token'
    required: true
  sonar-host-url:
    description: 'SonarQube server URL'
    required: true
  project-settings-file:
    description: 'Path to sonar-project.properties file'
    required: false
    default: 'sonar-project.properties'
  extra-args:
    description: 'Additional SonarQube scanner arguments'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # With the community branch plugin the scanner auto-detects the analyzed branch, and it
    # refuses a new-code reference branch equal to that branch (e.g. the scheduled development
    # deploy). Drop the reference in that case so Sonar falls back to the project's new-code setting.
    - name: Resolve new code reference branch
      id: reference
      shell: bash
      env:
        REFERENCE_BRANCH: ${{ inputs.sonar-reference-branch }}
        CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        if [[ -n "$REFERENCE_BRANCH" && "$REFERENCE_BRANCH" != "$CURRENT_BRANCH" ]]; then
          echo "arg=-Dsonar.newCode.referenceBranch=$REFERENCE_BRANCH" >> "$GITHUB_OUTPUT"
        else
          echo "Info: reference branch '$REFERENCE_BRANCH' is the analyzed branch; not setting sonar.newCode.referenceBranch"
        fi

    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_SCANNER_OPTS: -Xmx1536m
      with:
        #change the version in the extra_args to control the version of the project and the new code period
        # new code and branch name set to the PR destination branch and current branch respectively
        # Branch analysis (i.e., analyzing multiple branches independently) is a feature of SonarQube Developer Edition and above.
        # use projectKey as fall back instead of branch name key below        
        args: >
          -Dproject.settings=${{ inputs.project-settings-file }}
          -Dsonar.projectKey=${{ inputs.sonar-project-key }}
          -Dsonar.projectVersion=${{ inputs.sonar-project-version }}
          ${{ steps.reference.outputs.arg }}
          ${{ inputs.extra-args }}
